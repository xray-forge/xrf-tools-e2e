name: E2E

on:
  workflow_call:
    inputs:
      e2e_ref:
        description: xrf-tools-e2e revision to test
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: xray-forge/xrf-tools-e2e
          ref: ${{ inputs.e2e_ref || github.sha }}
          lfs: true

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download nightly CLI
        run: npm run cli:download

      - name: Run E2E suite
        run: npm run e2e
