name: Checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --timing

      - name: Collect npm timing logs
        if: ${{ always() }}
        run: |
          mkdir -p target/npm-logs
          cp -r "$(npm config get cache)/_logs/." target/npm-logs/

      - name: Upload npm timing logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-timing
          path: target/npm-logs
          if-no-files-found: warn
          retention-days: 3

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
