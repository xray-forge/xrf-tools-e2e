name: Debug application lane

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE: ${{ github.workspace }}\target\debug-app
  TAURI_DRIVER_VERSION: 2.0.6
  WEBVIEW2_POLICY_KEY: HKLM\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments

jobs:
  debug-app:
    name: Debug App (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore tauri-driver
        id: tauri-driver
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-${{ runner.os }}

      - name: Install tauri-driver
        if: ${{ steps.tauri-driver.outputs.cache-hit != 'true' }}
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked

      - name: Download nightly application
        run: npm run app:download

      # Every probe ends with `exit 0`: the runner's pwsh wrapper otherwise fails the step on the exit code of the
      # last native command, and a refused connection is the evidence, not the failure.
      - name: Probe D, registry switch with a fixed port
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:EVIDENCE\probeD"
          New-Item -ItemType Directory -Force $out | Out-Null

          reg add $env:WEBVIEW2_POLICY_KEY /v '*' /t REG_SZ /d '--remote-debugging-port=9377 --enable-logging --log-level=0' /f
          reg query $env:WEBVIEW2_POLICY_KEY

          # msedgedriver always sets this variable; it must not stop the registry value from being read.
          $env:WEBVIEW2_USER_DATA_FOLDER = "$out\user-data"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'

          $app = Start-Process -FilePath target\xrf-app.exe -PassThru `
            -RedirectStandardError "$out\stderr.txt" -RedirectStandardOutput "$out\stdout.txt"
          Start-Sleep -Seconds 15

          if ($app.HasExited) { "xrf-app EXITED with code $($app.ExitCode)" } else { "xrf-app ALIVE, pid $($app.Id)" }

          "== browser process command line"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { "[$($_.ProcessId)] $($_.CommandLine)" }

          "== DevToolsActivePort"
          $port = "$out\user-data\EBWebView\DevToolsActivePort"
          "present: $(Test-Path $port)"
          Get-Content $port -ErrorAction SilentlyContinue

          "== DevTools endpoint on the registry port 9377"
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9377/json/version).Content } catch { "no DevTools endpoint: $($_.Exception.Message)" }
          "== DevTools endpoint on the environment port 9333 (expected refused)"
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9333/json/version).Content } catch { "no DevTools endpoint: $($_.Exception.Message)" }

          "== chrome_debug.log lines about remote debugging"
          Select-String -Path "$out\user-data\EBWebView\chrome_debug.log" -Pattern 'remote|devtools|debugging' -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object Line

          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          exit 0

      - name: Probe E, raw msedgedriver session with the registry switch
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:EVIDENCE\probeE"
          New-Item -ItemType Directory -Force $out | Out-Null

          reg add $env:WEBVIEW2_POLICY_KEY /v '*' /t REG_SZ /d '--remote-debugging-port=0 --enable-automation --no-first-run --test-type=webdriver' /f

          $driver = Start-Process -FilePath "$env:EDGEWEBDRIVER\msedgedriver.exe" -PassThru `
            -ArgumentList '--port=9515', '--verbose', "--log-path=$out\msedgedriver.log"
          $deadline = (Get-Date).AddSeconds(20)
          do { Start-Sleep -Milliseconds 250; $ready = Test-NetConnection 127.0.0.1 -Port 9515 -InformationLevel Quiet -WarningAction SilentlyContinue } until ($ready -or (Get-Date) -gt $deadline)
          "msedgedriver listening: $ready"

          $body = @{
            capabilities = @{
              alwaysMatch = @{
                browserName = 'webview2'
                'ms:edgeOptions' = @{
                  binary = (Resolve-Path target\xrf-app.exe).Path
                  webviewOptions = @{}
                }
              }
            }
          } | ConvertTo-Json -Depth 6

          "== response"
          try {
            $response = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9515/session -Body $body -ContentType 'application/json' -TimeoutSec 150
            $response | ConvertTo-Json -Depth 6
            if ($response.value.sessionId) {
              "== title through the session"
              (Invoke-RestMethod -Uri "http://127.0.0.1:9515/session/$($response.value.sessionId)/title").value
              Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:9515/session/$($response.value.sessionId)" | Out-Null
            }
          } catch {
            "session request failed: $($_.Exception.Message)"
            if ($_.ErrorDetails.Message) { $_.ErrorDetails.Message }
          }

          "== msedgedriver.log launch and connect lines"
          Select-String -Path "$out\msedgedriver.log" -Pattern 'Launching|WEBVIEW2_|DevTools|Failed|connect|RESPONSE InitSession' -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object Line

          Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
          Get-Process xrf-app, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          exit 0

      - name: Probe F, the real suite with the registry switch
        shell: pwsh
        continue-on-error: true
        run: |
          reg add $env:WEBVIEW2_POLICY_KEY /v '*' /t REG_SZ /d '--remote-debugging-port=0 --enable-automation --no-first-run --test-type=webdriver' /f
          npm run e2e:app
          "e2e:app exit code: $LASTEXITCODE"
          exit 0

      - name: Remove the registry switch
        if: ${{ always() }}
        shell: pwsh
        run: |
          reg delete $env:WEBVIEW2_POLICY_KEY /f 2>&1
          exit 0

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-app-evidence
          path: |
            target/debug-app
            target/e2e-app
          if-no-files-found: warn
          retention-days: 3
